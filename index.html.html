<h3>📊 狀態列</h3><ul><li><b>時間</b>：走路和吃飯都會讓時間流逝，吃一餐約 30 分鐘。到 23:00 今天就結束。</li><li><b>金錢</b>：一開始有 NT$1000，每家店價格不同。</li><li><b>飽足</b>：吃東西會增加，會慢慢下降。飽足超過 85 就吃不下了。</li><li><b>精神</b>：吃東西、喝咖啡可以補充。精神太低（低於 15）時走路會變慢。</li></ul>
<h3>🍜 吃東西與圖鑑</h3><ul><li>在店門口按 E 會看到介紹，按「點餐」就會付錢、增加飽足和精神。</li><li><b>第一次吃</b>會新增一筆圖鑑；重複吃也可以，但是會再花錢，不會增加圖鑑數量。</li><li>視窗裡的「Google Maps」按鈕可以打開這間店的真實位置。</li><li>有些店還會跳出真實的食物照片。</li><li><b>龍燈夜市</b>只在每週五、六、日的 17:30 之後營業。</li><li><b>巷弄隱藏版</b>（共 6 間）一開始只是灰色的小店，要走近才會被發現。</li></ul>
<h3>🎫 三樓傢飾挑戰（折價券）</h3><ul><li>三樓傢飾位在<b>鐵軌右邊、靠近中華電信的那一排</b>，進去按 E 找店員對話。</li><li><b>第 1 階段</b>：圖鑑收集到 <b>5 家</b>，回去答一題，答對拿到<b>第 1 張 250 元折價券</b>。</li><li><b>第 2 階段</b>：圖鑑收集到 <b>10 家</b>，再答一題，答對再拿到<b>第 2 張 250 元折價券</b>。</li><li>兩張合計最多 <b>500 元</b>，折價券上會印著「專屬（你的名字）」。</li><li>答錯不會扣東西，但要<b>再多收集 4 家新的美食</b>才能重新挑戰。</li><li>折價券放在背包（B 鍵）裡。</li></ul>
<h3>🪙 賺錢與補給</h3><ul><li>街上散落一些零錢，走過去就會撿起來，每個 NT$15。</li><li>員林農會的 ATM 每位旅人<b>只能提領一次</b>，最多 NT$1000，可以選金額。</li><li>街上的居民聊聊天，有時會有小驚喜。</li></ul>
<h3>🏠 可以進去的地方</h3><ul><li><b>三樓傢飾</b>：逛家具、跟店員聊天、領折價券。</li><li><b>芃閣家具</b>：深色系的家具展示空間，老闆娘會跟你聊聊。</li><li><b>媚登峯</b>：醫美診所，營養師可以付費諮詢，幫你降低飽足值，吃太撐時很有用。</li><li>進去後走到下方的玻璃門，按 E 離開。</li></ul>
<h3>🚆 小心危險</h3><ul><li>員林車站旁的<b>平交道</b>，警示燈亮起、火車接近時<b>不能硬闖</b>，被撞到就是 GAME OVER，只能重新開始。</li><li>馬路上有車子，車子會停下來讓你，但也要注意別走太近。</li></ul>
<h3>🏁 結束與稱號</h3><ul><li>到 23:00、按任務視窗的「結束今天」，或把圖鑑集滿，都會結算。</li><li>稱號依圖鑑數量決定：初訪旅人 → 城市散步客（5 家以上）→ 在地老饕（10 家以上）→ <b>員林美食王</b>（全部集滿）。</li><li>每次結算都會存在首頁的「遊玩紀錄」裡。</li></ul></div>`+B('返回','cl()'))}
